name: reproducibility
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python analysis.py --output-dir /tmp/geospatial-output --write-map
      - run: pytest -q
      - run: jupyter nbconvert --to notebook --execute sf_crime_folium.ipynb --output /tmp/executed.ipynb
